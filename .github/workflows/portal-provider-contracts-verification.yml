name: Portal Provider Contracts Verification

# Clean-checkout verification of the TrustID provider contracts for the LifeOS
# Portal (OIDC id_token, Portal clients, CORS, authenticated step-up).
# Scoped to the verification branch; never deploys.
on:
  push:
    branches: [verify/portal-provider-contracts-v1, verify/portal-provider-ci-recovery-v1, security/master-device-containment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Full regression + builds
    runs-on: ubuntu-latest
    # The Digi RP suite (part of npm test) needs a local PostgreSQL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pdi_test
          POSTGRES_PASSWORD: pdi_test
          POSTGRES_DB: pdi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdi_test -d pdi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DIGI_CORE_TEST_DATABASE_URL: postgresql://pdi_test:pdi_test@127.0.0.1:5432/pdi_test
      DDI_TEST_DATABASE_URL: postgresql://pdi_test:pdi_test@127.0.0.1:5432/pdi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A clean checkout has no built workspace packages and no Prisma client,
      # and npm test assumes both. build:api builds the API's workspace
      # dependencies in order, generates the Prisma client (SQLite schema) and
      # builds the API; build:web builds the UI packages and the web app.
      - name: Build API (workspace deps, Prisma client, API)
        run: npm run build:api
      - name: Web production build (UI packages, typecheck, bundle)
        run: npm run build:web
      - name: Repository test suite (security packages, API, SDK, Digi, vault, UI)
        run: npm test

  postgres:
    name: Provider contracts on PostgreSQL + pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trustid_test
          POSTGRES_PASSWORD: trustid_test
          POSTGRES_DB: trustid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustid_test -d trustid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRUSTID_TEST_POSTGRES_URL: postgresql://trustid_test:trustid_test@127.0.0.1:5432/trustid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API test imports need every API workspace dependency built
      # (shared, zk, bbs-sdk, baas-sdk, sdk, sovereign-crypto, digi-bridge).
      - name: Build API workspace dependencies
        run: npm run build:api && npm run build -w @trustid/digi-bridge
      - name: Generate the Prisma client for PostgreSQL
        run: PRISMA_PROVIDER=postgresql node scripts/sync-prisma-provider.mjs && npm run db:generate -w @trustid/api
      - name: Provider contract suites against PostgreSQL
        run: >-
          npm run test -w @trustid/api -- --run
          tests/portal-oidc.test.ts tests/portal-cors.test.ts tests/step-up.test.ts
          tests/master-device-containment.test.ts tests/mybrandos-step-up.test.ts tests/trust-id-biometric.test.ts
          tests/android-master-device.test.ts tests/staging-deployment.test.ts
          tests/ambient-no-enroll-on-failure.test.ts tests/foundation-config.test.ts

  android:
    name: Android unit tests + staging release identity
    runs-on: ubuntu-latest
    env:
      # Placeholder until the staging site exists; the build only has to target a non-production origin.
      TRUSTID_STAGING_ORIGIN: ${{ vars.TRUSTID_STAGING_ORIGIN || 'https://trustid-staging.example.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Native Master Device plugins match their sources
        run: |
          for f in MasterDevicePlugin.kt PasskeyPlugin.kt; do
            diff -u "apps/device/native/android/$f" "apps/device/android/app/src/main/java/com/trustid/device/plugins/$f"
          done
      # The shell loads the hosted site, so a placeholder web directory is enough for cap sync.
      - name: Capacitor sync (production web origin)
        run: |
          mkdir -p apps/web/dist && [ -f apps/web/dist/index.html ] || echo '<!doctype html><title>TrustID</title>' > apps/web/dist/index.html
          cd apps/device && npx cap sync android
      - name: Android unit tests (Master Device prompt, OTA, biometric assets)
        working-directory: apps/device/android
        run: chmod +x gradlew && ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Staging release build (com.trustid.device.staging, staging origin, not debuggable)
        env:
          TRUSTID_RELEASE_KEYSTORE_B64: ${{ secrets.TRUSTID_STAGING_KEYSTORE_B64 }}
          TRUSTID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TRUSTID_STAGING_KEYSTORE_PASSWORD }}
          TRUSTID_RELEASE_KEY_ALIAS: ${{ secrets.TRUSTID_STAGING_KEY_ALIAS }}
          TRUSTID_RELEASE_KEY_PASSWORD: ${{ secrets.TRUSTID_STAGING_KEY_PASSWORD }}
        run: |
          (cd apps/device && CAP_SERVER_URL="$TRUSTID_STAGING_ORIGIN" npx cap sync android)
          if [ -n "$TRUSTID_RELEASE_KEYSTORE_B64" ]; then
            echo "$TRUSTID_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/staging.keystore"
            export TRUSTID_RELEASE_KEYSTORE="$RUNNER_TEMP/staging.keystore"
          else
            unset TRUSTID_RELEASE_KEYSTORE_PASSWORD TRUSTID_RELEASE_KEY_ALIAS TRUSTID_RELEASE_KEY_PASSWORD
            echo "Staging signing credentials are not configured: the APK stays unsigned (expected until approved)."
          fi
          cd apps/device/android
          ./gradlew --no-daemon :app:assembleRelease -PtrustidEnv=staging -PtrustidStagingOrigin="$TRUSTID_STAGING_ORIGIN"
          rm -f "$RUNNER_TEMP/staging.keystore"
      - name: Verify staging APK identity (package, debuggable, backup, web origin, signer when configured)
        env:
          TRUSTID_STAGING_SIGNER_SHA256: ${{ vars.TRUSTID_STAGING_SIGNER_SHA256 }}
        run: |
          APK=$(ls apps/device/android/app/build/outputs/apk/release/*.apk | head -1)
          node scripts/verify-android-apk.mjs "$APK" --package com.trustid.device.staging --origin "$TRUSTID_STAGING_ORIGIN" \
            ${TRUSTID_STAGING_SIGNER_SHA256:+--signer "$TRUSTID_STAGING_SIGNER_SHA256"}

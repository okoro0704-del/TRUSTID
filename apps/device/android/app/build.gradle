apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Single version source of truth: apps/device/release.json (also read by the OTA publisher).
// -PtrustidVersionCode / -PtrustidVersionName exist only for unpublished OTA test fixtures.
def trustidRelease = new groovy.json.JsonSlurper().parse(file('../../release.json'))
def trustidVersionCode = (project.findProperty('trustidVersionCode') ?: trustidRelease.versionCode) as Integer
def trustidVersionName = (project.findProperty('trustidVersionName') ?: trustidRelease.versionName) as String

// Environment: production (default) or staging. A staging build is a separate app
// (com.trustid.device.staging) that loads, and takes OTA updates from, the staging origin only:
//   CAP_SERVER_URL=https://<staging host> npx cap sync android
//   ./gradlew assembleRelease -PtrustidEnv=staging -PtrustidStagingOrigin=https://<staging host>
// Missing or production-pointing staging configuration fails the build (no production fallback).
def trustidProductionOrigin = 'https://trustedid.netlify.app'
def trustidEnv = (project.findProperty('trustidEnv') ?: 'production') as String
if (!(trustidEnv in ['production', 'staging'])) {
    throw new GradleException("trustidEnv must be 'production' or 'staging', not '${trustidEnv}'")
}
def trustidStagingOrigin = (project.findProperty('trustidStagingOrigin') ?: '') as String
if (trustidEnv == 'staging' && (!(trustidStagingOrigin ==~ /^https:\/\/[a-z0-9]([a-z0-9.-]*[a-z0-9])?$/) || trustidStagingOrigin == trustidProductionOrigin)) {
    throw new GradleException("Staging builds need -PtrustidStagingOrigin=https://<staging host> (an https origin that is not production)")
}
def trustidWebOrigin = trustidEnv == 'staging' ? trustidStagingOrigin : trustidProductionOrigin
def trustidApplicationId = trustidEnv == 'staging' ? "${trustidRelease.applicationId}.staging" : trustidRelease.applicationId
def trustidOtaManifestUrl = trustidEnv == 'staging' ? "${trustidStagingOrigin}/releases/trustid-android.json" : trustidRelease.otaManifestUrl

android {
    namespace "com.trustid.device"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId trustidApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode trustidVersionCode
        versionName trustidVersionName
        buildConfigField "String", "TRUSTID_OTA_MANIFEST_URL", "\"${trustidOtaManifestUrl}\""
        buildConfigField "String", "TRUSTID_ENVIRONMENT", "\"${trustidEnv}\""
        buildConfigField "String", "TRUSTID_WEB_ORIGIN", "\"${trustidWebOrigin}\""
        buildConfigField "String", "TRUSTID_RELEASE_CHANNEL", "\"${trustidRelease.channel}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             // <dir>releases keeps published OTA APKs (web public/releases) out of the shell itself.
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!<dir>releases'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // Release signing comes only from the environment of a protected build (never from the repo):
    // TRUSTID_RELEASE_KEYSTORE (path), TRUSTID_RELEASE_KEYSTORE_PASSWORD, TRUSTID_RELEASE_KEY_ALIAS,
    // TRUSTID_RELEASE_KEY_PASSWORD. Without all four the release APK is left unsigned; it is never
    // signed with the debug key. See docs/security/android-master-device-release-signing.md.
    def releaseSigning = ['TRUSTID_RELEASE_KEYSTORE', 'TRUSTID_RELEASE_KEYSTORE_PASSWORD', 'TRUSTID_RELEASE_KEY_ALIAS', 'TRUSTID_RELEASE_KEY_PASSWORD']
        .collectEntries { [(it): System.getenv(it)] }
    def releaseSigningConfigured = releaseSigning.values().every { it }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.TRUSTID_RELEASE_KEYSTORE)
                storePassword releaseSigning.TRUSTID_RELEASE_KEYSTORE_PASSWORD
                keyAlias releaseSigning.TRUSTID_RELEASE_KEY_ALIAS
                keyPassword releaseSigning.TRUSTID_RELEASE_KEY_PASSWORD
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Release builds are never debuggable (no run-as, no WebView inspection, BuildConfig.DEBUG false).
            debuggable false
            signingConfig releaseSigningConfigured ? signingConfigs.release : null
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.biometric:biometric:1.1.0"
    // Native passkeys (Credential Manager) for Master Device enrollment / revocation.
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // android.jar ships org.json as stubs; OTA manifest parsing tests need the real implementation.
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// The web shell must point at this build's environment. Staging: every build. Production: release
// builds (debug builds may load a preview with CAP_SERVER_URL for development).
def verifyTrustIdWebOrigin = tasks.register('verifyTrustIdWebOrigin') {
    def capConfig = file('src/main/assets/capacitor.config.json')
    doLast {
        if (!capConfig.exists()) {
            throw new GradleException("${capConfig} is missing: run 'npx cap sync android' first")
        }
        def url = new groovy.json.JsonSlurper().parse(capConfig)?.server?.url
        if (trustidEnv == 'staging' && url != trustidStagingOrigin) {
            throw new GradleException("Staging build must load ${trustidStagingOrigin}, but capacitor.config.json has '${url}'. Run: CAP_SERVER_URL=${trustidStagingOrigin} npx cap sync android")
        }
        if (trustidEnv == 'production' && url != null && url != trustidProductionOrigin) {
            throw new GradleException("Production release must load ${trustidProductionOrigin}, but capacitor.config.json has '${url}'")
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild' || (trustidEnv == 'staging' && task.name == 'preDebugBuild')) {
        task.dependsOn verifyTrustIdWebOrigin
    }
}

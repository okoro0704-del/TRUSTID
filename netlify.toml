# TrustID PWA on Netlify — API proxied to Railway (same-origin cookies)

[build]
  command = "npm run build -w @trustid/shared && npm run build -w @trustid/sdk && npm run build -w @trustid/device-security && npm run build -w @trustid/vault-sdk && npm run build -w @trustid/ui-react && npm run build -w @trustid/sovereign-crypto && npm run build -w @trustid/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin /api so session cookies work (do not point VITE_API_URL at Railway)
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions-disabled"

# Proxy API to Railway — browser sees trustedid.netlify.app (first-party cookies)
[[redirects]]
  from = "/api/*"
  to = "https://lucid-integrity-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "https://lucid-integrity-production.up.railway.app/"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

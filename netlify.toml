# TrustID PWA on Netlify — API proxied to Railway (same-origin cookies)

[build]
  command = "node scripts/fetch-biometric-models.mjs && node scripts/copy-ort-wasm.mjs && node scripts/copy-mediapipe-wasm.mjs && npm run build -w @trustid/shared && npm run build -w @trustid/sdk && npm run build -w @trustid/device-security && npm run build -w @trustid/vault-sdk && npm run build -w @trustid/ui-react && npm run build -w @trustid/sovereign-crypto && npm run build -w @trustid/web && node scripts/netlify-api-routing.mjs apps/web/dist && node scripts/netlify-asset-links.mjs apps/web/dist"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin /api so session cookies work (do not point VITE_API_URL at Railway)
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions-disabled"

# Biometric runtimes live under version-scoped paths
# (/ort/<onnxruntime-web version>/, /mediapipe/<tasks-vision version>/), so a
# version bump changes the URL and they can be cached immutably.
# The SDK keeps verified copies of every biometric asset in Cache Storage and
# fetches with cache: "no-store", so a cached error page is never replayed.
# Digital Asset Links: generated per environment by scripts/netlify-asset-links.mjs (production app
# on the production site, staging app on the staging site, none on previews). Served as JSON, never
# cached long, so a change of app signing certificate takes effect promptly. When no file is
# generated the path answers 404 (rule below), never the SPA HTML.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Model paths are not versioned (manifest.json lives here too) and Netlify
# applies these headers to 404s as well, so revalidate instead of pinning.
[[headers]]
  for = "/models/trustid/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Biometric engine release (scripts/stage-biometric-assets.mjs). Paths are
# content-addressed (/biometric/<sha256 prefix>/<file>), so they never change
# and may be cached forever. The SDK fetches the .gz.bin files as plain binaries
# in Range requests (resumable) and checks SHA-256 itself; octet-stream keeps
# any intermediary from adding Content-Encoding. CORS lets other Digiconomy
# origins use this host as their asset CDN (no credentials are involved).
[[headers]]
  for = "/biometric/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
    Access-Control-Expose-Headers = "Content-Range, Content-Length, Accept-Ranges"

[[headers]]
  for = "/biometric/release.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Android OTA channel. The manifest must never be served stale; the APK URL is stable
# (TrustID.apk) so it is revalidated too and bound by SHA-256 in the manifest.
[[headers]]
  for = "/releases/trustid-android.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/releases/TrustID.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "attachment; filename=\"TrustID.apk\""
    X-Content-Type-Options = "nosniff"

# One canonical TrustID address. Passkeys (WEBAUTHN_RP_ID), token issuers and
# the API's CORS allow-list are all bound to trustedid.netlify.app, so the
# getlifeos alias is redirected instead of served (served, its API calls fail
# with origin_not_allowed and passkeys cannot work). Must stay first.
# Installed copies of the app on the alias are run by their service worker
# from cache and never see the 301 below (and a redirected /sw.js update is
# refused by the browser). Serve them a worker that retires itself instead.
[[redirects]]
  from = "https://trustid.getlifeos.app/sw.js"
  to = "/sw-retire.js"
  status = 200
  force = true

[[redirects]]
  from = "https://trustid.getlifeos.app/*"
  to = "https://trustedid.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://trustid.getlifeos.app/*"
  to = "https://trustedid.netlify.app/:splat"
  status = 301
  force = true

# API proxy (same-origin /api, first-party cookies): generated per environment into the publish
# directory's _redirects by scripts/netlify-api-routing.mjs, which Netlify applies before these
# rules. Production site → production API; staging → its own API (TRUSTID_API_PROXY_ORIGIN);
# deploy previews → no API unless TRUSTID_PREVIEW_API_ORIGIN (never production). If that step did
# not run, /api answers 404 here: there is no default target and no production fallback.
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/api"
  to = "/404.html"
  status = 404
  force = true

# Missing biometric assets must fail as 404. Without these the SPA fallback
# answers with index.html (HTTP 200) under the immutable headers above.
[[redirects]]
  from = "/ort/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/models/trustid/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/mediapipe/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wasm/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/biometric/*"
  to = "/404.html"
  status = 404

# Served only by the installed Android app (WebView intercept); never by the web host.
[[redirects]]
  from = "/__trustid_native__/*"
  to = "/404.html"
  status = 404

# A missing hashed chunk must fail loudly instead of evaluating index.html as JS.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Digital Asset Links not generated for this deployment: 404, not the SPA page (not forced, so a
# generated file is always served as-is).
[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/404.html"
  status = 404

# Android release artifacts (APK, OTA manifest) exist only in production builds. Anywhere they are
# absent (staging, previews) the path must fail as 404, never answer with the SPA page under the
# release headers above. Not forced: a published production release file is always served as-is.
[[redirects]]
  from = "/releases/*"
  to = "/404.html"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# TrustID PWA on Netlify — API proxied to Railway (same-origin cookies)

[build]
  command = "node scripts/fetch-biometric-models.mjs && node scripts/copy-ort-wasm.mjs && node scripts/copy-mediapipe-wasm.mjs && npm run build -w @trustid/shared && npm run build -w @trustid/sdk && npm run build -w @trustid/device-security && npm run build -w @trustid/vault-sdk && npm run build -w @trustid/ui-react && npm run build -w @trustid/sovereign-crypto && npm run build -w @trustid/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin /api so session cookies work (do not point VITE_API_URL at Railway)
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions-disabled"

# Biometric runtimes live under version-scoped paths
# (/ort/<onnxruntime-web version>/, /mediapipe/<tasks-vision version>/), so a
# version bump changes the URL and they can be cached immutably.
# The SDK keeps verified copies of every biometric asset in Cache Storage and
# fetches with cache: "no-store", so a cached error page is never replayed.
[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Model paths are not versioned (manifest.json lives here too) and Netlify
# applies these headers to 404s as well, so revalidate instead of pinning.
[[headers]]
  for = "/models/trustid/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Android OTA channel. The manifest must never be served stale; the APK URL is stable
# (TrustID.apk) so it is revalidated too and bound by SHA-256 in the manifest.
[[headers]]
  for = "/releases/trustid-android.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/releases/TrustID.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "attachment; filename=\"TrustID.apk\""
    X-Content-Type-Options = "nosniff"

# Proxy API to Railway — browser sees trustedid.netlify.app (first-party cookies)
[[redirects]]
  from = "/api/*"
  to = "https://lucid-integrity-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "https://lucid-integrity-production.up.railway.app/"
  status = 200
  force = true

# Missing biometric assets must fail as 404. Without these the SPA fallback
# answers with index.html (HTTP 200) under the immutable headers above.
[[redirects]]
  from = "/ort/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/models/trustid/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/mediapipe/*"
  to = "/404.html"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

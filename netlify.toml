# TrustID PWA on Netlify — API proxied to Railway (same-origin cookies)

[build]
  command = "node scripts/fetch-biometric-models.mjs && node scripts/copy-ort-wasm.mjs && node scripts/copy-mediapipe-wasm.mjs && npm run build -w @trustid/shared && npm run build -w @trustid/sdk && npm run build -w @trustid/device-security && npm run build -w @trustid/vault-sdk && npm run build -w @trustid/ui-react && npm run build -w @trustid/sovereign-crypto && npm run build -w @trustid/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  # Same-origin /api so session cookies work (do not point VITE_API_URL at Railway)
  VITE_API_URL = "/api"

[functions]
  directory = "netlify/functions-disabled"

# Biometric runtimes live under version-scoped paths
# (/ort/<onnxruntime-web version>/, /mediapipe/<tasks-vision version>/), so a
# version bump changes the URL and they can be cached immutably.
# The SDK keeps verified copies of every biometric asset in Cache Storage and
# fetches with cache: "no-store", so a cached error page is never replayed.
[[headers]]
  for = "/mediapipe/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Model paths are not versioned (manifest.json lives here too) and Netlify
# applies these headers to 404s as well, so revalidate instead of pinning.
[[headers]]
  for = "/models/trustid/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Biometric engine release (scripts/stage-biometric-assets.mjs). Paths are
# content-addressed (/biometric/<sha256 prefix>/<file>), so they never change
# and may be cached forever. The SDK fetches the .gz.bin files as plain binaries
# in Range requests (resumable) and checks SHA-256 itself; octet-stream keeps
# any intermediary from adding Content-Encoding. CORS lets other Digiconomy
# origins use this host as their asset CDN (no credentials are involved).
[[headers]]
  for = "/biometric/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
    Access-Control-Expose-Headers = "Content-Range, Content-Length, Accept-Ranges"

[[headers]]
  for = "/biometric/release.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

# Android OTA channel. The manifest must never be served stale; the APK URL is stable
# (TrustID.apk) so it is revalidated too and bound by SHA-256 in the manifest.
[[headers]]
  for = "/releases/trustid-android.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/releases/TrustID.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "attachment; filename=\"TrustID.apk\""
    X-Content-Type-Options = "nosniff"

# One canonical TrustID address. Passkeys (WEBAUTHN_RP_ID), token issuers and
# the API's CORS allow-list are all bound to trustedid.netlify.app, so the
# getlifeos alias is redirected instead of served (served, its API calls fail
# with origin_not_allowed and passkeys cannot work). Must stay first.
[[redirects]]
  from = "https://trustid.getlifeos.app/*"
  to = "https://trustedid.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://trustid.getlifeos.app/*"
  to = "https://trustedid.netlify.app/:splat"
  status = 301
  force = true

# Proxy API to Railway — browser sees trustedid.netlify.app (first-party cookies)
[[redirects]]
  from = "/api/*"
  to = "https://lucid-integrity-production.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "https://lucid-integrity-production.up.railway.app/"
  status = 200
  force = true

# Missing biometric assets must fail as 404. Without these the SPA fallback
# answers with index.html (HTTP 200) under the immutable headers above.
[[redirects]]
  from = "/ort/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/models/trustid/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/mediapipe/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wasm/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/biometric/*"
  to = "/404.html"
  status = 404

# Served only by the installed Android app (WebView intercept); never by the web host.
[[redirects]]
  from = "/__trustid_native__/*"
  to = "/404.html"
  status = 404

# A missing hashed chunk must fail loudly instead of evaluating index.html as JS.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

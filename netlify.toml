# TrustID PWA only — API runs on Railway
#
# Set in Netlify UI (Environment variables):
#   VITE_API_URL=https://lucid-integrity-production.up.railway.app

[build]
  command = "npm run build -w @trustid/shared && npm run build -w @trustid/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# Do not bundle Netlify Functions (API is on Railway)
[functions]
  directory = "netlify/functions-disabled"

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
buildCommand = "npm run build:api"

[deploy]
# prisma db push includes --accept-data-loss (see apps/api package.json) for schema sync on Postgres
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Required Railway variables:
# DATABASE_URL = Postgres plugin URL (postgresql://...)
# COOKIE_SECRET, WEBAUTHN_RP_ID, WEBAUTHN_ORIGIN, WEBAUTHN_RP_NAME, CORS_ORIGINS
